<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کارنامه و نتایج قبلی — PolyBet AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: #0B0F19;
  color: #F8FAFC;
  font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.6;
}
a { color: inherit; text-decoration: none; }
.ltr { direction: ltr; display: inline-block; font-variant-numeric: tabular-nums; }

.header {
  background: rgba(17, 24, 39, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #1E293B;
  position: sticky;
  top: 0;
  z-index: 20;
}
.header-inner {
  max-width: 1140px;
  margin: 0 auto;
  padding: 0.75rem 1rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.65rem;
}
.brand {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  font-weight: 800;
  font-size: 1rem;
  white-space: nowrap;
}
.brand-logo {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: linear-gradient(135deg, #10B981, #4F46E5);
  color: #052E16;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  flex-shrink: 0;
}
.nav {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  background: #0B0F19;
  padding: 0.25rem;
  border-radius: 12px;
  border: 1px solid #1E293B;
}
.nav-btn {
  padding: 0.4rem 0.75rem;
  border-radius: 9px;
  font-size: 0.78rem;
  font-weight: 800;
  color: #94A3B8;
  white-space: nowrap;
}
.nav-btn.active {
  background: #10B981;
  color: #052E16;
}

.container {
  max-width: 1140px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem 4rem;
}

.hero-summary {
  background: #111827;
  border: 1px solid #1E293B;
  border-radius: 20px;
  padding: 1.35rem;
  margin-bottom: 1.5rem;
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 1.5rem;
}
@media (max-width: 640px) {
  .hero-summary { grid-template-columns: 1fr; }
}
.ring-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ring-svg { transform: rotate(-90deg); }
.ring-val {
  position: absolute;
  font-size: 0.9rem;
  font-weight: 800;
  color: #34D399;
}

.bar-wrap { display: flex; flex-direction: column; gap: 0.6rem; }
.bar-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.bar-track {
  height: 14px;
  background: #1E293B;
  border-radius: 999px;
  overflow: hidden;
  display: flex;
  padding: 2px;
  gap: 3px;
}
.seg-win { height: 100%; background: #10B981; border-radius: 999px; }
.seg-loss { height: 100%; background: #F43F5E; border-radius: 999px; }

.res-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
  gap: 1rem;
}
@media (max-width: 640px) {
  .res-grid { grid-template-columns: 1fr; }
}
.res-card {
  background: #111827;
  border: 1px solid #1E293B;
  border-radius: 16px;
  padding: 1.1rem;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 0.75rem;
}
.res-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.76rem;
}
.status.win { color: #34D399; font-weight: 800; }
.status.loss { color: #FB7185; font-weight: 800; }
.ext-link { color: #94A3B8; font-size: 0.74rem; }
.res-title {
  font-weight: 700;
  font-size: 0.94rem;
  color: #FFFFFF;
  text-align: left;
  line-height: 1.45;
}
.res-compare {
  background: #0B0F19;
  border: 1px solid #1E293B;
  border-radius: 12px;
  padding: 0.7rem 0.9rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
  color: #94A3B8;
}
.pick { color: #34D399; }
.final { color: #FFFFFF; }
.empty { text-align: center; padding: 3rem; color: #94A3B8; }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">P</div>
      <span>PolyBet AI</span>
    </div>
    <nav class="nav">
      <a class="nav-btn" href="index.html">پیشنهادهای هوشمند امروز</a>
      <a class="nav-btn active" href="results.html">کارنامه و نتایج قبلی (0)</a>
    </nav>
    <span></span>
  </div>
</header>

<main class="container">
  <div class="hero-summary">
    <div style="display:flex;align-items:center;gap:1rem;">
      
    <div class="ring-wrap" style="width:78px;height:78px;">
      <svg width="78" height="78" viewBox="0 0 78 78" class="ring-svg">
        <circle cx="39" cy="39" r="32" stroke="#1E293B" stroke-width="7" fill="transparent"/>
        <circle cx="39" cy="39" r="32" stroke="#10B981" stroke-width="7"
                stroke-dasharray="201.06" stroke-dashoffset="201.06"
                stroke-linecap="round" fill="transparent"/>
      </svg>
      <span class="ring-val ltr">0.0%</span>
    </div>
    
      <div>
        <div style="font-size:0.78rem;color:#34D399;font-weight:700;">دقت پیش‌بینی‌های ربات</div>
        <div style="font-size:1.3rem;font-weight:800;color:#FFF;">0 درست از 0 بازار</div>
        <div style="font-size:0.76rem;color:#94A3B8;">آمار واقعی بازارهای تسویه‌شده در Polymarket</div>
      </div>
    </div>

    <div class="bar-wrap">
      <div class="bar-head">
        <strong style="font-size:0.86rem;">نمودار مقایسه‌ای پیش‌بینی‌های درست در برابر خطا</strong>
        <div style="display:flex;gap:1rem;font-size:0.8rem;font-weight:700;">
          <span style="color:#34D399;">درست: 0 (0.0%)</span>
          <span style="color:#FB7185;">خطا: 0 (0.0%)</span>
        </div>
      </div>
      <div class="bar-track">
        <div class="seg-win" style="width:0.0%"></div>
        <div class="seg-loss" style="width:0.0%"></div>
      </div>
    </div>
  </div>

  <div class="res-grid">
    <div class="empty">هنوز نتیجه‌ای ثبت نشده است.</div>
  </div>
</main>
</body>
</html>
