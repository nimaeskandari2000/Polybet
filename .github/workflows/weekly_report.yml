# .github/workflows/weekly_report.yml
# PLACEMENT: .github/workflows/weekly_report.yml (exact path)
#
# UPGRADES & FIXES (PolyBet v2.0 — Zero-Config Unique GitHub Link per Report):
# 1. NO `DASHBOARD_URL` SECRET REQUIRED:
#    Automatically uses `GITHUB_REPOSITORY` (`owner/repo`) and `GITHUB_REF_NAME`
#    to create a permanent snapshot `docs/scans/results-<YYYYMMDD-HHMMSS>.html`
#    and sends both the instant preview link (`htmlpreview.github.io`) and
#    GitHub Pages link in Telegram.
# 2. PUSH-BEFORE-SEND ORDER:
#    Commits and pushes `docs/` and `predictions_resolved.csv` to GitHub FIRST,
#    then dispatches the Telegram message so the unique link is immediately live.

name: PolyBet Weekly Report

on:
  schedule:
    - cron: "0 18 * * 0"   # Sunday 18:00 UTC = ~21:30 Iran time
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Who triggered this run"
        required: false
        default: "scheduled"
        type: string
      rebuild_cache:
        description: "Re-evaluate all cached resolutions from scratch"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

concurrency:
  group: polybet-repo-write
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report, self-heal resolution cache & generate unique snapshot
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DEBUG_RESOLUTION: ${{ secrets.DEBUG_RESOLUTION }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'scheduled' }}
          REBUILD_RESOLVED_CACHE: ${{ inputs.rebuild_cache || 'false' }}
        run: python weekly_report.py --prepare-telegram /tmp/polybet_weekly_msg.txt

      - name: Commit & push updated resolution cache + unique results snapshot
        run: |
          git config user.name "polybet-bot"
          git config user.email "polybet-bot@users.noreply.github.com"
          git add predictions_resolved.csv docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Report run ($TRIGGER_SOURCE): $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin HEAD
            git push
          fi

      - name: Send Telegram weekly report with unique live GitHub link
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f /tmp/polybet_weekly_msg.txt ]; then
            python weekly_report.py --send-prepared /tmp/polybet_weekly_msg.txt
          fi
